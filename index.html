<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolest.ai — Вхід та Налаштування</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ЕКРАН 1: ВХІД / РЕЄСТРАЦІЯ -->
<div id="screen-login" class="screen active">
  <div class="auth-card">
    <h1 class="logo-text">Bolest<span class="accent-text">.ai</span></h1>
    <p class="auth-subtitle" id="auth-mode-subtitle">Увійдіть у свій акаунт</p>
    <label class="field-label" for="email-input">Email</label>
    <input type="email" id="email-input" placeholder="example@mail.com" autocomplete="email">
    <label class="field-label" for="password-input">Пароль</label>
    <input type="password" id="password-input" placeholder="Введіть пароль" autocomplete="current-password">
    <button id="auth-submit-btn" class="primary-btn" type="button">Увійти</button>
    <p class="auth-switch">
      <span id="auth-switch-text">Немає акаунту?</span>
      <button id="auth-switch-btn" class="link-btn" type="button">Зареєструватися</button>
    </p>
    <p class="auth-note" id="auth-note"></p>
  </div>
</div>

<!-- ЕКРАН 2: НАЛАШТУВАННЯ ПРОФІЛЮ -->
<div id="screen-setup" class="screen">
  <div class="auth-card setup-card">
    <h2>Налаштування профілю</h2>
    <div class="avatar-upload">
      <label for="avatar-input" class="avatar-preview" id="avatar-preview">
        <span id="avatar-placeholder">+</span>
        <img id="avatar-img" src="" alt="Фото профілю" style="display:none">
      </label>
      <input type="file" id="avatar-input" accept="image/*" hidden>
      <p class="hint">Фото профілю (не обов'язково)</p>
    </div>
    <label class="field-label" for="nickname-input">Нікнейм</label>
    <input type="text" id="nickname-input" placeholder="Введіть нікнейм" maxlength="20">
    <label class="field-label" for="description-input">Опис профілю</label>
    <div class="description-row">
      <textarea id="description-input" placeholder="Розкажіть трохи про себе..." maxlength="150"></textarea>
      <button id="random-quote-btn" class="secondary-btn" type="button">Випадкова цитата</button>
    </div>
    <button id="finish-setup-btn" class="primary-btn" type="button" onclick="window.location.href='dashboard.html'">Почати навчання</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
